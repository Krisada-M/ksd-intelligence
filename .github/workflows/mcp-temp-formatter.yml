name: Temporary MCP formatter

on:
  push:
    branches: [feat/agy-mcp-stdio-20261119]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and echo base64 artifacts
        shell: bash
        run: |
          npx prettier --write scripts/mcp/stdio.mjs scripts/mcp/tools.mjs tests/packaging/agy-mcp.test.js
          for f in scripts/mcp/stdio.mjs scripts/mcp/tools.mjs tests/packaging/agy-mcp.test.js; do
            echo "KSD_FMT_BEGIN:$f"
            node -e 'process.stdout.write(require("fs").readFileSync(process.argv[1]).toString("base64")+"\n")' "$f"
            echo "KSD_FMT_END"
          done

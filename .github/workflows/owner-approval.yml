name: Owner approval

# Deterministic backstop for the rules in AGENTS.md: a pull request that touches the
# owner-confirmed oracle, the frozen KSD policy module or accepted snapshots needs the
# `owner-approved` label, which only the owner adds on GitHub. Agents never touch GitHub.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-paths:
    name: Protected paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check protected paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'owner-approved') }}
        run: node scripts/check-protected-paths.mjs "$BASE" "$HEAD"
